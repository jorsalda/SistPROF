{% extends "colegio/colegio_base.html" %}

{% block colegio_page_title %}
{% if sede %}
Editar Sede
{% else %}
Nueva Sede
{% endif %}
{% endblock %}

{% block colegio_content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        <i class="bi bi-building"></i>

        {% if sede %}
            Editar Sede
        {% else %}
            Nueva Sede
        {% endif %}
    </h2>

    <a href="{{ url_for('colegio.sedes') }}"
       class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
        Volver
    </a>

</div>

<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <form method="POST">
                <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Nombre de la sede
                </label>

                <input type="text"
                       name="nombre"
                       class="form-control"
                       value="{{ sede.nombre if sede else '' }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Dirección
                </label>

                <input type="text"
                       name="direccion"
                       class="form-control"
                       value="{{ sede.direccion if sede else '' }}">

            </div>

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Teléfono
                </label>

                <input type="text"
                       name="telefono"
                       class="form-control"
                       value="{{ sede.telefono if sede else '' }}">

            </div>

            <div class="form-check mb-4">

                <input class="form-check-input"
                       type="checkbox"
                       name="activo"
                       id="activo"
                       {% if sede and sede.activo %}checked{% endif %}>

                <label class="form-check-label"
                       for="activo">
                    Sede activa
                </label>

            </div>

            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-save"></i>

                    {% if sede %}
                        Actualizar sede
                    {% else %}
                        Guardar sede
                    {% endif %}

                </button>

                <a href="{{ url_for('colegio.sedes') }}"
                   class="btn btn-outline-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
