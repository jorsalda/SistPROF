{% extends "colegio/colegio_base.html" %}

{% block title %}
Cambiar Contraseña Coordinador
{% endblock %}

{% block colegio_content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h4>Cambiar Contraseña</h4>
        </div>

        <div class="card-body">

            <p>
                <strong>Nombre:</strong>
                {{ coordinador.usuario.nombre }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ coordinador.usuario.email }}
            </p>

            <form method="POST">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">
                        Nueva Contraseña
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Guardar Contraseña
                </button>

                <a href="{{ url_for('colegio.lista_coordinadores') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
