{% extends "colegio/colegio_base.html" %}

{% block colegio_page_title %}
Motor Ingenios
{% endblock %}

{% block colegio_content %}

<div class="container-fluid py-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>🧠 Motor de Evaluación Ingenios</h2>
            <p class="text-muted mb-0">
                Evaluación interactiva para estudiantes
            </p>
        </div>

        <a href="{{ url_for('estudiante.listar') }}"
           class="btn btn-secondary">
            ← Volver
        </a>
    </div>

    <!-- Configuración -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3 align-items-end">

                <!-- Número de preguntas -->
                <div class="col-md-4">
                    <label for="numQuestions" class="form-label">
                        Número de preguntas
                    </label>

                    <input type="number"
                           id="numQuestions"
                           min="1"
                           value="1"
                           class="form-control">
                </div>

                <!-- Botón actualizar -->
                <div class="col-md-2">
                    <button id="updateQuestions"
                            class="btn btn-primary w-100">
                        Actualizar
                    </button>
                </div>

                <!-- Archivo JSON -->
                <div class="col-md-6">
                    <label for="fileInput" class="form-label">
                        Archivo JSON
                    </label>

                    <input type="file"
                           id="fileInput"
                           accept=".json"
                           class="form-control">
                </div>

            </div>

            <!-- Botón cargar -->
            <div class="mt-3">
                <button id="loadQuestions"
                        class="btn btn-success">
                    Cargar preguntas
                </button>
            </div>

            <!-- Información -->
            <div class="mt-3">
                <span id="selectedNumQuestions"
                      class="me-3 fw-bold text-primary">
                </span>

                <span id="loadedQuestionsCount"
                      class="fw-bold text-success">
                </span>
            </div>

        </div>
    </div>

    <!-- Área principal -->
    <div class="row g-4">

        <!-- CONTEXTO -->
        <div class="col-lg-4">

            <div class="card shadow-sm h-100">

                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">
                        📘 Contexto
                    </h5>
                </div>

                <div class="card-body">
                    <div id="contexto"></div>
                </div>

            </div>

        </div>

        <!-- PREGUNTA -->
        <div class="col-lg-5">

            <div class="card shadow-sm h-100">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        ❓ Pregunta
                    </h5>
                </div>

                <div class="card-body">

                    <!-- Pregunta -->
                    <div id="question"
                         class="fs-5 fw-semibold">
                    </div>

                    <!-- Opciones -->
                    <div id="options"
                         class="mt-4">
                    </div>

                    <!-- Contador -->
                    <div id="countdown"
                         class="mt-4 text-danger fw-bold"
                         style="display:none;">
                    </div>

                    <!-- Botones -->
                    <div class="mt-4 d-flex gap-2">

                        <button id="nextButton"
                                class="btn btn-primary"
                                style="display:none;">
                            Siguiente
                        </button>

                        <button id="explanationButton"
                                class="btn btn-info text-white"
                                style="display:none;">
                            Ver explicación
                        </button>

                    </div>

                    <!-- Feedback -->
                    <div id="feedback"
                         class="mt-4"
                         style="display:none;">
                    </div>

                </div>

            </div>

        </div>

        <!-- EXPLICACIÓN -->
        <div class="col-lg-3">

            <div class="card shadow-sm h-100">

                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        💡 Explicación
                    </h5>
                </div>

                <div class="card-body">

                    <div id="explanation-column"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- RESULTADO -->
    <div id="result"
         class="mt-4"
         style="display:none;">
    </div>

</div>

<!-- ======================================= -->
<!-- JQUERY DESDE INTERNET (CDN) -->
<!-- ======================================= -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ======================================= -->
<!-- MOTOR INGENIOS -->
<!-- ======================================= -->
<script src="{{ url_for('static', filename='js/ClsEstudiante.js') }}"></script>

<!-- ======================================= -->
<!-- INICIALIZAR -->
<!-- ======================================= -->
<script>
    $(document).ready(function () {

        const juego = new CslTIngenios();

        juego.init();

    });
</script>

{% endblock %}
